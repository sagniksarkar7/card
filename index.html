<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Before and After Slider Template</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f5f5f5;
    }
    .container {
      width: 800px;
      height: 400px;
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }
    .image-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
    }
    .before, .after {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
    }
    .before {
      background-image: url(guerilla.jpg);
      z-index: 1;
    }
    .after {
      background-image: url(guerilla1.avif);
      clip-path: inset(0 50% 0 0);
      z-index: 2;
    }
    .label {
      position: absolute;
      bottom: 20px;
      color: white;
      font-size: 24px;
      font-weight: bold;
      text-transform: uppercase;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
      z-index: 4;
      transition: opacity 0.3s ease;
    }
    .label-before {
      left: 20px;
    }
    .label-after {
      right: 20px;
    }
    .slider {
      position: absolute;
      top: 0;
      left: 50%;
      width: 4px;
      height: 100%;
      background-color: transparent;
      z-index: 3;
      cursor: ew-resize;
      user-select: none;
    }
    .divider {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 40px;
      height: 40px;
      background-color: white;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
      z-index: 4;
    }
    .divider::before {
      content: '|||';
      font-size: 16px;
      color: #333;
      font-weight: bold;
    }
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.3), transparent);
      z-index: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="image-wrapper">
      <div class="before">
        <div class="overlay"></div>
      </div>
      <div class="after">
        <div class="overlay"></div>
      </div>
      <div class="label label-before" id="label-before">Without Lightify</div>
      <div class="label label-after" id="label-after">With Lightify</div>
      <div class="slider" id="slider">
        <div class="divider"></div>
      </div>
    </div>
  </div>
  <script>
    const slider = document.getElementById('slider');
    const afterImage = document.querySelector('.after');
    const labelBefore = document.getElementById('label-before');
    const labelAfter = document.getElementById('label-after');
    const container = document.querySelector('.container');

    let isDragging = false;

    function updateSliderPosition(x) {
      const containerRect = container.getBoundingClientRect();
      let position = ((x - containerRect.left) / containerRect.width) * 100;
      position = Math.max(0, Math.min(100, position));
      slider.style.left = `${position}%`;
      afterImage.style.clipPath = `inset(0 ${100 - position}% 0 0)`;

      // Adjust label opacity based on slider position
      const beforeOpacity = 1 - (position / 100);
      const afterOpacity = position / 100;
      labelBefore.style.opacity = beforeOpacity;
      labelAfter.style.opacity = afterOpacity;
    }

    slider.addEventListener('mousedown', (e) => {
      isDragging = true;
      updateSliderPosition(e.clientX);
    });

    document.addEventListener('mousemove', (e) => {
      if (isDragging) {
        updateSliderPosition(e.clientX);
      }
    });

    document.addEventListener('mouseup', () => {
      isDragging = false;
    });

    slider.addEventListener('touchstart', (e) => {
      isDragging = true;
      updateSliderPosition(e.touches[0].clientX);
    });

    document.addEventListener('touchmove', (e) => {
      if (isDragging) {
        updateSliderPosition(e.touches[0].clientX);
      }
    });

    document.addEventListener('touchend', () => {
      isDragging = false;
    });

    updateSliderPosition(container.offsetWidth / 2);
  </script>
</body>
</html>
